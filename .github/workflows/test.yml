name: 🧪 Run Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v1

    - name: Install dependencies
      run: bun install

    - name: Build library
      run: bun run build

    - name: Run unit tests (offline)
      run: bun test 'spec'
