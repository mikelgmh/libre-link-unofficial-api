name: 🧪 Run Integration Tests

# Hits the real LibreLinkUp API — manual only, needs real credentials
# in repo secrets and is gentle by design (5s between calls).
on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v1

    - name: Install dependencies
      run: bun install

    - name: Run integration tests
      run: bun run test-int
      env:
        LIBRE_LINK_EMAIL: ${{ secrets.LIBRE_LINK_EMAIL }}
        LIBRE_LINK_PASSWORD: ${{ secrets.LIBRE_LINK_PASSWORD }}
        LIBRE_LINK_UP_VERSION: ${{ secrets.LIBRE_LINK_UP_VERSION }}
