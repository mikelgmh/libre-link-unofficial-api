name: 🛡️ LibreLinkUp version watch

# Probes the version ladder against the real API and keeps
# llu-versions.json fresh, so consumers self-update their client
# fingerprint without a library release.
on:
  schedule:
    - cron: '30 3 * * *' # daily 03:30 UTC
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Probe versions
        run: bun scripts/check-llu-versions.ts
        env:
          LIBRE_LINK_EMAIL: ${{ secrets.LIBRE_LINK_EMAIL }}
          LIBRE_LINK_PASSWORD: ${{ secrets.LIBRE_LINK_PASSWORD }}

      - name: Commit updated versions file
        run: |
          if git diff --quiet llu-versions.json; then
            echo "No version change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llu-versions.json
          git commit -m "chore: update LibreLinkUp client fingerprint [skip ci]"
          git push
